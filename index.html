<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Duel Racer" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Duel Racer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <button id="pauseBtn" class="hidden" aria-label="Pausar">II</button>
    <div id="pause" class="hidden">
      <b>PAUSA</b>
      <button id="resume">CONTINUAR</button>
      <button id="quit">ABANDONAR</button>
    </div>

    <div id="controls" class="hidden">
      <div class="side">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="side">
        <div id="gearBtns">
          <button data-key="shiftUp" class="small">▲</button>
          <button data-key="shiftDown" class="small">▼</button>
        </div>
        <button data-key="brake" class="brake">FREIO</button>
        <button data-key="gas" class="gas">ACEL</button>
      </div>
    </div>

    <div id="rotate">Gire o celular para jogar na horizontal ↻</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
