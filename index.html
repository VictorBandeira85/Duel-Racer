<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Duel Racer" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Duel Racer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="fps" class="hidden"></div>
    <button id="pauseBtn" class="hidden" aria-label="Pausar">II</button>
    <button id="radioBtn" class="hidden" aria-label="Rádio: trocar de estação"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18v12H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 8l11-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="14" r="2.5" fill="currentColor"/><path d="M13 12h5M13 16h5" stroke="currentColor" stroke-width="2"/></svg><span id="radioShort">FM</span></button>
    <div id="radioTag" class="hidden"><b id="radioFreq">FM 101.7</b><i id="radioName">SYNTH</i><small id="radioSong"></small></div>
    <div id="pause" class="hidden">
      <b>PAUSA</b>
      <button id="resume">CONTINUAR</button>
      <div class="quick"><button id="qMusic"></button><button id="qSound"></button></div>
      <button id="restart">REINICIAR TRECHO</button>
      <button id="setBtn">AJUSTES</button>
      <button id="report">REPORTAR PROBLEMA</button>
      <button id="quit">ABANDONAR</button>
      <button id="pauseMin" class="desk">MINIMIZAR</button>
      <i id="nowPlaying"></i>
    </div>
    <div id="quitDlg" class="hidden">
      <b>SAIR DO JOGO?</b>
      <div class="quick"><button id="quitYes">SIM</button><button id="quitNo">NÃO</button></div>
      <button id="quitMin" class="desk">MINIMIZAR</button>
    </div>
    <div id="settings" class="hidden">
      <b>AJUSTES</b>
      <div class="tabs">
        <button data-tab="0"></button>
        <button data-tab="1"></button>
        <button data-tab="2"></button>
        <button data-tab="3"></button>
      </div>
      <div class="grid">
        <button data-set="gear" data-in="0"></button>
        <button data-set="buttons" data-in="0"></button>
        <button data-set="fx" data-in="1"></button>
        <button data-set="fps30" data-in="1"></button>
        <button data-set="fps" data-in="1"></button>
        <button data-set="view" data-in="1"></button>
        <button data-set="sfxvol" data-in="2"></button>
        <button data-set="volume" data-in="2"></button>
        <button data-set="track" data-in="2"></button>
        <button data-set="radio" data-in="2"></button>
        <button data-set="hud" data-in="3"></button>
        <button data-set="hints" data-in="3"></button>
        <button data-set="ghost" data-in="3"></button>
      </div>
      <button id="setBack">◀ VOLTAR</button>
      <small id="credits"></small>
      <small id="version"></small>
    </div>

    <div id="controls" class="hidden">
      <div class="side">
        <button data-key="left" aria-label="Esquerda"><svg viewBox="0 0 24 24" width="56%" height="56%" aria-hidden="true"><path d="M14.5 4 L5 12 L14.5 20 L14.5 15 L20 15 L20 9 L14.5 9 Z" fill="currentColor" stroke="rgba(0,0,0,0.55)" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
        <button data-key="right" aria-label="Direita"><svg viewBox="0 0 24 24" width="56%" height="56%" aria-hidden="true"><path d="M9.5 4 L19 12 L9.5 20 L9.5 15 L4 15 L4 9 L9.5 9 Z" fill="currentColor" stroke="rgba(0,0,0,0.55)" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="side">
        <button data-key="clutch" id="clutchBtn" class="small hidden">EMB</button>
        <div id="gearBtns">
          <button data-key="shiftUp" class="small">▲</button>
          <div id="gearNum">1</div>
          <button data-key="shiftDown" class="small">▼</button>
        </div>
        <button data-key="brake" class="brake" aria-label="Freio"><svg viewBox="0 0 32 28" width="62%" height="56%" aria-hidden="true"><path d="M16 1 L16 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><rect x="3" y="9" width="26" height="16" rx="3.5" fill="currentColor" stroke="rgba(0,0,0,0.55)" stroke-width="1"/><g stroke="rgba(0,0,0,0.45)" stroke-width="1.5" stroke-linecap="round"><path d="M7 13.5h18M7 17h18M7 20.5h18"/></g></svg></button>
        <button data-key="gas" class="gas" aria-label="Acelerador"><svg viewBox="0 0 24 32" width="48%" height="64%" aria-hidden="true"><path d="M12 1 L12 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M7 6 L17 6 L18.5 30 L5.5 30 Z" fill="currentColor" stroke="rgba(0,0,0,0.55)" stroke-width="1" stroke-linejoin="round"/><g stroke="rgba(0,0,0,0.45)" stroke-width="1.4" stroke-linecap="round"><path d="M8.6 10.5h6.8M8.4 14.5h7.2M8.2 18.5h7.6M8 22.5h8M7.8 26.5h8.4"/></g></svg></button>
        <button data-horn id="hornBtn" class="small" aria-label="Buzina"><svg viewBox="0 0 28 24" width="78%" height="78%" aria-hidden="true"><circle cx="5" cy="12" r="4.2" fill="currentColor"/><path d="M8.5 10.2 L15 10.2 L24.5 3 L24.5 21 L15 13.8 L8.5 13.8 Z" fill="currentColor" stroke="rgba(0,0,0,0.5)" stroke-width="0.9" stroke-linejoin="round"/><ellipse cx="24.5" cy="12" rx="1.8" ry="9" fill="currentColor" stroke="rgba(0,0,0,0.5)" stroke-width="0.9"/></svg></button>
      </div>
    </div>

    <div id="rotate">Gire o celular para jogar na horizontal ↻</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
